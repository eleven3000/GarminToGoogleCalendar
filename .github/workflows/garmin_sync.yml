name: Garmin Coach Calendar Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-sync-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Wir schmeißen alle google-auth Pakete raus und nutzen nur pyjwt[crypto]
          pip install requests google-genai "pyjwt[crypto]"

      - name: Run Calendar Sync Script
        env:
          GARMIN_URL: ${{ secrets.GARMIN_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
